* {

/* ===== 亞洲地標背景 ===== */

.landmark-wrap {

  position: fixed;

  inset: 0;

  z-index: 0;

  pointer-events: none;

  overflow: hidden;

}

.landmark-art {

  position: absolute;

  width: 100%;

  bottom: 2%;

  left: 0;

  opacity: 0.07;

  transition: opacity .5s ease;

}

  width: 100%;

  height: auto;

  display: block;

}

/* ===== 主要畫面 ===== */

.page {

  position: relative;

  z-index: 2;

  width: 100%;

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 32px 22px 52px;

}

.shell {

  width: 100%;

  max-width: 430px;

}

.panel {

  position: relative;

  background: rgba(255, 255, 252, 0.88);

  border: 1px solid rgba(173, 181, 126, .58);

  border-radius: 28px;

  padding: 42px 26px 34px;

  box-shadow:

  backdrop-filter: blur(5px);

  text-align: center;

  overflow: hidden;

}

.main-star {

  margin-bottom: 18px;

.intro {

button {

button:active {

.secondary-btn {

.hidden {

/* ===== 抽卡動畫 ===== */

.flight-screen {

  display: none;

  min-height: 315px;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  position: relative;

}

.flight-text {

  margin-top: 165px;

  font-size: 14px;

  letter-spacing: 1px;

  color: #858d70;

}

.flight-route {

  position: absolute;

  width: 300px;

  height: 160px;

  top: 35px;

  left: 50%;

  transform: translateX(-50%);

}

.route-line {

  fill: none;

  stroke: #c5ad6d;

  stroke-width: 1.5;

  stroke-dasharray: 5 7;

  opacity: .65;

}

.plane {

  position: absolute;

  left: 36px;

  top: 112px;

  font-size: 27px;

  color: #8c986d;

  animation:

    flyPlane 1.35s cubic-bezier(.25,.6,.35,1) forwards;

}

@keyframes flyPlane {

  0% {

    transform:

      translate(0, 15px)

      rotate(-12deg);

    opacity: 0;

  }

  15% {

    opacity: 1;

  }

  100% {

    opacity: 0;

  }

}

/* =====================================================

   localStorage

===================================================== */

const KEY_FIRST =

  "littleHappiness_firstSeen_v2";

const KEY_DECK =

  "littleHappiness_remaining_v2";

const KEY_LAST =

  "littleHappiness_lastCard_v2";

/* =====================================================

   洗牌

===================================================== */

function shuffle(array) {

  const arr = [...array];

  for (

    let i = arr.length - 1;

    i > 0;

    i--

  ) {

    const j = Math.floor(

      Math.random() * (i + 1)

    );

    [arr[i], arr[j]] =

      [arr[j], arr[i]];

  }

  return arr;

}

/* =====================================================

   建立新一輪卡池

===================================================== */

function createFreshDeck() {

  let indexes =

    cards.map((_, index) => index);

  indexes = shuffle(indexes);

  const last =

    localStorage.getItem(KEY_LAST);

  /*

     避免上一輪最後一張

     馬上成為下一輪第一張

  */

  if (

    last !== null &&

    indexes.length > 1 &&

    indexes[0] === Number(last)

  ) {

    const temp = indexes[0];

    indexes[0] = indexes[1];

    indexes[1] = temp;

  }

  localStorage.setItem(

    KEY_DECK,

    JSON.stringify(indexes)

  );

  return indexes;

}

/* =====================================================

   從尚未出現過的卡抽一張

===================================================== */

function takeOneCard() {

  let deck;

  try {

    deck = JSON.parse(

      localStorage.getItem(KEY_DECK)

    );

  }

  catch {

    deck = null;

  }

  if (

    !Array.isArray(deck) ||

    deck.length === 0

  ) {

    deck = createFreshDeck();

  }

  const index = deck.shift();

  localStorage.setItem(

    KEY_DECK,

    JSON.stringify(deck)

  );

  localStorage.setItem(

    KEY_LAST,

    index.toString()

  );

  return {

    index,

    card: cards[index]

  };

}

/* =====================================================

   正式抽卡

===================================================== */

function drawOfficialCard() {

  resetCardButtons();

  const result = takeOneCard();

  showCard(result.card);

}

/* =====================================================

   顯示一張卡

===================================================== */

function showCard(card) {

  resetCardButtons();

  document

    .getElementById("resultScreen")

    .classList.remove("hidden");

  document

    .getElementById("resultCard")

    .style.display = "block";

  document

    .getElementById("cardTitle")

    .innerText =

      card.title;

  document

    .getElementById("cardText")

    .innerText =

      card.text;

  if (

    card.type === "retry"

  ) {

    document

      .getElementById("retryButton")

      .classList.remove("hidden");

  }

  else if (

    card.type === "double"

  ) {

    document

      .getElementById("doubleButton")

      .classList.remove("hidden");

  }

  else {

    document

      .getElementById("acceptButton")

      .classList.remove("hidden");

  }

}

/* =====================================================

   再抽一次

===================================================== */

function drawExtraCard() {

  changeLandmark();

  hideAll();

  const flight =

    document.getElementById(

      "flightScreen"

    );

  flight.style.display = "flex";

  const plane =

    flight.querySelector(".plane");

  plane.style.animation = "none";

  void plane.offsetWidth;

  plane.style.animation =

    "flyPlane 1.35s cubic-bezier(.25,.6,.35,1) forwards";

  setTimeout(() => {

    flight.style.display = "none";

    const result =

      takeOneCard();

    showCard(result.card);

  }, 1400);

}

/* =====================================================

   雙倍小開心

===================================================== */

function drawDoubleCards() {

  resetCardButtons();

  const first =

    takeOneCard();

  const second =

    takeOneCard();

  const area =

    document.getElementById(

      "doubleArea"

    );

  document

    .getElementById(

      "doubleTitle1"

    )

    .innerText =

      first.card.title;

  document

    .getElementById(

      "doubleText1"

    )

    .innerText =

      first.card.text;

  document

    .getElementById(

      "doubleTitle2"

    )

    .innerText =

      second.card.title;

  document

    .getElementById(

      "doubleText2"

    )

    .innerText =

      second.card.text;

  area.style.display =

    "block";

}

/* =====================================================

   收下 → 結束

===================================================== */

function finishDraw() {

  hideAll();

  document

    .getElementById("endScreen")

    .classList.remove("hidden");

  document

    .querySelector(".end-title")

    .innerText =

      "今天的小開心已送達 ✦";

  document

    .querySelector(".end-text")

    .innerHTML =

`希望有讓今天<br>

多一點點開心。<br><br>

下次想起來的時候，<br>

再來吧。`;

}

/* =====================================================

   網頁載入

===================================================== */

window.addEventListener(

  "DOMContentLoaded",

  () => {

    changeLandmark();

  }

);

</script>
