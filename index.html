<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>LITTLE HAPPINESS</title>

<style>
:root{
  --ink:#4f5445;
  --olive:#8f9d68;
  --line:rgba(154,164,111,.58);
  --gold:#c69d39;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
}

body{
  min-height:100svh;
  background:#f7f3e8;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

/* 背景固定裁切框：頁面滑動時永遠只顯示一個城市格 */
#bgPhoto{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  z-index:0;
  overflow:hidden;
  background-repeat:no-repeat;
  background-position:center;
  background-size:cover;
}

#cityCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  pointer-events:none;
}

#bgVeil{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:rgba(255,250,245,.10);
}

.page{
  position:relative;
  z-index:2;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.shell{
  width:100%;
  max-width:285px;
}

.panel{
  background:rgba(255,253,247,.90);
  border:1px solid var(--line);
  border-radius:24px;
  padding:18px 13px 15px;
  text-align:center;
  box-shadow:0 14px 32px rgba(70,70,45,.13);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

.hidden{display:none!important}

.main-star,.card-star,.end-star{color:var(--gold)}

.main-star{
  font-size:25px;
  margin-bottom:13px;
}

h1{
  margin:0 0 20px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:25px;
  font-weight:500;
  letter-spacing:1.5px;
  color:#414739;
}

.intro{
  font-size:16px;
  line-height:1.8;
  margin:0 auto 21px;
}

button{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  font-family:inherit;
  cursor:pointer;
}

button:active{transform:scale(.97)}

.primary-btn,.secondary-btn{
  border-radius:999px;
}

.primary-btn{
  min-width:210px;
  padding:13px 20px;
  background:var(--olive);
  color:#fff;
  font-size:16px;
}

.secondary-btn{
  margin-top:11px;
  padding:10px 18px;
  background:rgba(255,253,247,.9);
  color:#78845b;
  border:1px solid #aab585;
  font-size:14px;
}

.flight-screen{
  min-height:220px;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  position:relative;
}

.flight-route{

  width:260px;
  height:150px;
  top:20px;
  left:50%;
  transform:translateX(-50%);
}

.route-line{
  fill:none;
  stroke:#c5ad6d;
  stroke-width:1.5;
  stroke-dasharray:5 7;
}

.plane{
  position:absolute;
  left:25px;
  top:90px;
  font-size:27px;
}

.flight-text{
  margin-top:120px;
  font-size:13px;
}

@keyframes flyPlane{
  0%{transform:translate(0,15px);opacity:0}
  15%{opacity:1}
  100%{transform:translate(205px,-75px);opacity:0}
}

.result-card{
  padding:15px 12px;
  border:1px solid rgba(202,196,155,.85);
  border-radius:19px;
  background:rgba(255,253,247,.95);
  box-shadow:0 8px 20px rgba(74,69,45,.09);

.card-title{

.card-text{

  line-height:1.55;
}

.card-star{
  font-size:15px;
  margin-top:8px;
}

.first-note{
  font-size:12px;
  line-height:1.65;
  color:#858473;
  margin:15px 0 0;
}

.double-area{
  margin-top:13px;
}

.double-caption{
  font-size:13px;
  line-height:1.6;
}

.mini-card{
  position:relative;
  overflow:hidden;
  margin-top:10px;
  border-radius:16px;
  border:1px solid rgba(214,207,168,.9);
  min-height:175px;
  display:flex;

.mini-bg{

}

.mini-veil{

  background:rgba(255,252,244,.62);

.mini-content{

}

.mini-title{
  font-size:15px;
  font-weight:650;
  color:#6f7956;
  margin-bottom:8px;
}

.mini-text{

  font-size:14px;

.small-hint{

.end-star{

.end-title{

.end-text{

.back-btn{

.cat-title-click{

.cat-photo-wrap{

</style>
</head>

const KEY_FIRST="littleHappiness_firstSeen_v4";
const KEY_DECK="littleHappiness_remaining_v5";
const KEY_LAST="littleHappiness_lastCard_v4";
const KEY_CYCLE_SEEN="littleHappiness_cycleSeen_v2";
const KEY_DRAW_COUNT="littleHappiness_drawCount_v2";
const KEY_CONFESSION_SEEN="littleHappiness_confessionSeen_v2";

let currentView=null;
let lastBackground=null;

const cityImage=new Image();
cityImage.src=SPRITE_BG;
let currentCityIndex=null;

function resizeCityCanvas(){
  if(currentCityIndex===null)return;
  drawCityToCanvas(currentCityIndex);
}

function drawCityToCanvas(cityIndex){
  const p=cityPositions[cityIndex];
  const canvas=document.getElementById("cityCanvas");
  const ctx=canvas.getContext("2d");

  const dpr=Math.min(window.devicePixelRatio||1,2);
  const cw=Math.max(1,Math.round(window.innerWidth*dpr));
  const ch=Math.max(1,Math.round(window.innerHeight*dpr));

  if(canvas.width!==cw)canvas.width=cw;
  if(canvas.height!==ch)canvas.height=ch;

  ctx.clearRect(0,0,cw,ch);

  /* cover 裁切，但固定左下角，確保城市名稱不被切掉 */
  const scale=Math.max(cw/p.w,ch/p.h);
  const dw=p.w*scale;
  const dh=p.h*scale;
  const dx=0;
  const dy=ch-dh;

  ctx.drawImage(
    cityImage,
    p.x,p.y,p.w,p.h,
    dx,dy,dw,dh
  );
}

function setHomeBackground(){
  const bg=document.getElementById("bgPhoto");

function setCityBackground(cityIndex){
  const bg=document.getElementById("bgPhoto");

  currentCityIndex=cityIndex;
  bg.style.backgroundImage="none";
  canvas.style.display="block";

  const draw=()=>drawCityToCanvas(cityIndex);

  if(cityImage.complete && cityImage.naturalWidth){
    draw();
  }else{
    cityImage.onload=draw;
  }

  lastBackground=cityIndex;
}

function setMiniBackground(element,cityIndex){
  /* 雙倍卡的小縮圖維持原本顯示方式 */
  const p=cityPositions[cityIndex];
  const col=cityIndex%3;
  const row=Math.floor(cityIndex/3);
  const x=col===0?0:(col===1?50:100);
  const y=row===0?0:(row===1?25:(row===2?50:(row===3?75:100)));

  element.style.backgroundSize="300% 500%";
  element.style.backgroundPosition=`${x}% ${y}%`;
}

window.addEventListener("resize",resizeCityCanvas);
window.addEventListener("orientationchange",()=>setTimeout(resizeCityCanvas,120));

function shuffle(array){

const arr=[...array];

for(let i=arr.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[arr[i],arr[j]]=[arr[j],arr[i]];

}

return arr;

}

function getCycleSeen(){

let seen;

try{
  seen=JSON.parse(localStorage.getItem(KEY_CYCLE_SEEN));
}catch(e){
  seen=[];
}

if(!Array.isArray(seen)){
  seen=[];
}

/* 只接受有效且不重複的卡片索引 */
seen=[...new Set(
  seen.filter(index=>
    Number.isInteger(index) &&
    index>=0 &&
    index<cards.length
  )
)];

if(seen.length>=cards.length){
  seen=[];
}

localStorage.setItem(KEY_CYCLE_SEEN,JSON.stringify(seen));

return seen;

}

function buildDeckFromSeen(seen){

const seenSet=new Set(seen);

let indexes=shuffle(
  cards
    .map((_,index)=>index)
    .filter(index=>!seenSet.has(index))
);

/* 新一輪的第一張不要和上一輪最後一張相同 */
const last=localStorage.getItem(KEY_LAST);

if(
seen.length===0 &&
last!==null &&
indexes.length>1 &&
indexes[0]===Number(last)
){
  [indexes[0],indexes[1]]=[indexes[1],indexes[0]];
}

localStorage.setItem(KEY_DECK,JSON.stringify(indexes));

return indexes;

}

function takeOneCard(){

let seen=getCycleSeen();
let deck;

try{
  deck=JSON.parse(localStorage.getItem(KEY_DECK));
}catch(e){
  deck=null;
}

const seenSet=new Set(seen);

/*
  牌組完整性檢查：
  1. 必須是陣列
  2. 每個索引都有效
  3. 牌組內不可重複
  4. 不可包含本輪已抽過的卡
  5. 剩餘張數必須正確
  任一條件不符就只從「本輪尚未抽過」的卡重建，
  因此同一輪 15 張內不可能重複。
*/
const deckIsValid=
  Array.isArray(deck) &&
  deck.every(index=>
    Number.isInteger(index) &&
    index>=0 &&
    index<cards.length &&
    !seenSet.has(index)
  ) &&
  new Set(deck).size===deck.length &&
  deck.length===cards.length-seen.length;

if(!deckIsValid || deck.length===0){
  deck=buildDeckFromSeen(seen);
}

const index=deck.shift();

seen.push(index);

localStorage.setItem(KEY_DECK,JSON.stringify(deck));
localStorage.setItem(KEY_CYCLE_SEEN,JSON.stringify(seen));
localStorage.setItem(KEY_LAST,String(index));

return{
  index:index,
  card:cards[index]
};

}

function hideAll(){

document.getElementById("homeScreen").classList.add("hidden");

document.getElementById("flightScreen").style.display="none";

document.getElementById("resultScreen").classList.add("hidden");

document.getElementById("endScreen").classList.add("hidden");

}

function resetActions(){

[
"acceptButton",
"retryButton",
"doubleButton",
"firstInfo",
"doubleArea"
].forEach(id=>{

document.getElementById(id).classList.add("hidden");

});

}

function startFlight(callback){

hideAll();

const flight=document.getElementById("flightScreen");

flight.style.display="flex";

const plane=flight.querySelector(".plane");

plane.style.animation="none";

void plane.offsetWidth;

plane.style.animation="flyPlane 1.35s cubic-bezier(.25,.6,.35,1) forwards";

setTimeout(()=>{

flight.style.display="none";

callback();

},1400);

}

function startDraw(){

startFlight(()=>{

if(!localStorage.getItem(KEY_FIRST)){

showFirstCard();

}else{

drawOfficialCard();

}

});

}

function showFirstCard(){

const count=addDrawCount();

if(
count===52 &&
localStorage.getItem(KEY_CONFESSION_SEEN)!=="yes"
){
  localStorage.setItem(KEY_CONFESSION_SEEN,"yes");
  showConfessionCard();
  return;
}

resetActions();

setHomeBackground();

document.getElementById("resultScreen").classList.remove("hidden");

prepareCatCardIfNeeded(null);

document.getElementById("cardTitle").innerText=firstCard.title;

document.getElementById("cardText").innerText=firstCard.text;

document.getElementById("firstInfo").classList.remove("hidden");

currentView=null;

}

function confirmFirstCard(){

localStorage.setItem(KEY_FIRST,"yes");

hideAll();

setHomeBackground();

document.getElementById("endScreen").classList.remove("hidden");

document.getElementById("endTitle").innerText="設定完成 ✦";

document.getElementById("endText").innerHTML=
"下次再掃 QR Code，<br>就開始正式抽卡囉！";

document.getElementById("backToLastButton").classList.add("hidden");

}

function drawOfficialCard(){

const count=addDrawCount();

if(
count===52 &&
localStorage.getItem(KEY_CONFESSION_SEEN)!=="yes"
){
  localStorage.setItem(KEY_CONFESSION_SEEN,"yes");
  showConfessionCard();
  return;
}

const result=takeOneCard();

showCard(
result.index,
result.card,
true
);

}

function showCard(index,card,saveView){

resetActions();

setCityBackground(card.city);

document.getElementById("resultScreen").classList.remove("hidden");

prepareCatCardIfNeeded(card);

document.getElementById("cardTitle").innerText=card.title;

document.getElementById("cardText").innerText=card.text;

if(card.type==="retry"){

document.getElementById("retryButton").classList.remove("hidden");

}else if(card.type==="double"){

document.getElementById("doubleButton").classList.remove("hidden");

}else{

document.getElementById("acceptButton").classList.remove("hidden");

}

if(saveView){

currentView={
kind:"single",
index:index
};

}

}

function drawExtraCard(){

startFlight(()=>{

const count=addDrawCount();

if(
count===52 &&
localStorage.getItem(KEY_CONFESSION_SEEN)!=="yes"
){
  localStorage.setItem(KEY_CONFESSION_SEEN,"yes");
  showConfessionCard();
  return;
}

const result=takeOneCard();

showCard(
result.index,
result.card,
true
);

});

}

function drawDoubleCards(){

const first=takeOneCard();

const second=takeOneCard();

resetActions();

document.getElementById("doubleArea").classList.remove("hidden");

document.getElementById("doubleTitle1").innerText=first.card.title;

document.getElementById("doubleText1").innerText=first.card.text;

setMiniBackground(
document.getElementById("miniBg1"),
first.card.city
);

document.getElementById("doubleTitle2").innerText=second.card.title;

document.getElementById("doubleText2").innerText=second.card.text;

setMiniBackground(
document.getElementById("miniBg2"),
second.card.city
);

currentView={
kind:"double",
first:first.index,
second:second.index,
base:lastBackground
};

}

function finishDraw(){

hideAll();

if(lastBackground!==null){

setCityBackground(lastBackground);

}

document.getElementById("endScreen").classList.remove("hidden");

document.getElementById("endTitle").innerText=
"今天的小開心已送達 ✦";

document.getElementById("endText").innerHTML=
"希望有讓今天<br>"+
"多一點點開心。<br><br>"+
"下次想起來的時候，<br>"+
"再來吧。";

if(currentView){

document.getElementById("backToLastButton").classList.remove("hidden");

}else{

document.getElementById("backToLastButton").classList.add("hidden");

}

}

function restoreLastView(){

if(!currentView)return;

hideAll();

if(currentView.kind==="single"){

const card=cards[currentView.index];

showCard(
currentView.index,
card,
false
);

}else{

const card1=cards[currentView.first];

const card2=cards[currentView.second];

setCityBackground(
currentView.base ?? card1.city
);

document.getElementById("resultScreen").classList.remove("hidden");

resetActions();

document.getElementById("doubleArea").classList.remove("hidden");

document.getElementById("doubleTitle1").innerText=card1.title;

document.getElementById("doubleText1").innerText=card1.text;

setMiniBackground(
document.getElementById("miniBg1"),
card1.city
);

document.getElementById("doubleTitle2").innerText=card2.title;

document.getElementById("doubleText2").innerText=card2.text;

setMiniBackground(
document.getElementById("miniBg2"),
card2.city
);

}

}

window.addEventListener("DOMContentLoaded",()=>{

setHomeBackground();

});

</script>
