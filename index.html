<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>LITTLE HAPPINESS</title>

<style>

:root{

  --ink:#4f5445;

  --olive:#8f9d68;

  --line:rgba(154,164,111,.58);

  --paper:rgba(255,253,247,.91);

  --paper-strong:rgba(255,253,247,.95);

  --gold:#c69d39;

}

*{

  box-sizing:border-box;

}

html,body{

  margin:0;

  min-height:100%;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "PingFang TC",

    "Noto Sans TC",

    "Microsoft JhengHei",

    sans-serif;

  color:var(--ink);

}

body{

  min-height:100svh;

  background:#f7f3e8;

  overflow-x:hidden;

}

#bgPhoto{

  position:fixed;

  inset:0;

  z-index:0;

  background-repeat:no-repeat;

  background-position:center;

  background-size:cover;

  transition:

    opacity .35s ease,

    filter .35s ease;

  filter:

    saturate(1.05)

    contrast(1.03);

}

/* 背景只做輕微淡化 */

#bgVeil{

  position:fixed;

  inset:0;

  z-index:1;

  pointer-events:none;

  background:

    linear-gradient(

      180deg,

      rgba(255,249,245,.22),

      rgba(249,247,225,.30)

    );

}

.page{

  position:relative;

  z-index:2;

  min-height:100svh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:

    20px

    18px

    calc(24px + env(safe-area-inset-bottom));

}

.shell{

  width:100%;

  max-width:430px;

}

.panel{

  background:rgba(255,253,247,.91);

  border:

    1px solid var(--line);

  border-radius:26px;

  padding:

    30px

    22px

    24px;

  text-align:center;

  box-shadow:

    0 16px 38px rgba(70,70,45,.13);

  backdrop-filter:blur(7px);

  -webkit-backdrop-filter:blur(7px);

}

.hidden{

  display:none !important;

}

.main-star,

.card-star,

.end-star{

  color:var(--gold);

}

.main-star{

  font-size:26px;

  margin-bottom:16px;

}

h1{

  margin:0 0 26px;

  font-family:

    Georgia,

    "Times New Roman",

    serif;

  font-size:28px;

  font-weight:500;

  letter-spacing:2px;

  color:#414739;

}

.intro{

  font-size:18px;

  line-height:2;

  margin:0 auto 26px;

  color:#55594d;

}

button{

  appearance:none;

  -webkit-appearance:none;

  border:0;

  font-family:inherit;

  cursor:pointer;

}

.primary-btn,

.secondary-btn{

  border-radius:999px;

  letter-spacing:.5px;

  transition:

    transform .12s ease;

}

button:active{

  transform:scale(.97);

}

.primary-btn{

  min-width:230px;

  padding:

    16px

    26px;

  background:var(--olive);

  color:white;

  font-size:17px;

  box-shadow:

    0 8px 20px

    rgba(90,105,62,.18);

}

.secondary-btn{

  margin-top:18px;

  padding:

    13px

    23px;

  background:

    rgba(255,253,247,.82);

  color:#78845b;

  border:

    1px solid #aab585;

  font-size:15px;

}

/* ===== 飛機動畫 ===== */

.flight-screen{

  min-height:250px;

  display:none;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  position:relative;

}

.flight-route{

  position:absolute;

  width:300px;

  height:160px;

  top:28px;

  left:50%;

  transform:translateX(-50%);

}

.route-line{

  fill:none;

  stroke:#c5ad6d;

  stroke-width:1.5;

  stroke-dasharray:5 7;

  opacity:.72;

}

.plane{

  position:absolute;

  left:36px;

  top:102px;

  font-size:28px;

  color:#7f8c63;

}

.flight-text{

  margin-top:135px;

  font-size:14px;

  letter-spacing:1px;

  color:#707960;

}

@keyframes flyPlane{

  0%{

    transform:

      translate(0,15px)

      rotate(-12deg);

    opacity:0;

  }

  15%{

    opacity:1;

  }

  100%{

    transform:

      translate(230px,-83px)

      rotate(-9deg);

    opacity:0;

  }

}

/* ===== 正式卡片 ===== */

.result-card{

  padding:

    24px

    18px;

  border:

    1px solid

    rgba(202,196,155,.85);

  border-radius:22px;

  background:

    rgba(255,253,247,.95);

  box-shadow:

    0 10px 25px

    rgba(74,69,45,.09);

  animation:

    cardAppear .45s ease;

}

@keyframes cardAppear{

  from{

    opacity:0;

    transform:translateY(10px);

  }

  to{

    opacity:1;

    transform:translateY(0);

  }

}

.card-title{

  font-size:19px;

  font-weight:650;

  color:#707b56;

  margin-bottom:18px;

}

.card-text{

  white-space:pre-line;

  font-size:18px;

  line-height:1.9;

  color:#464b3f;

}

.card-star{

  font-size:17px;

  margin-top:16px;

}

/* ===== 首次限定 ===== */

.first-note{

  font-size:13px;

  line-height:1.8;

  color:#858473;

  margin:

    22px

    0

    0;

}

/* ===== 雙倍 ===== */

.double-area{

  margin-top:22px;

}

.double-caption{

  font-size:14px;

  line-height:1.7;

  color:#717964;

  margin-bottom:14px;

}

.mini-card{

  position:relative;

  overflow:hidden;

  margin-top:14px;

  border-radius:18px;

  border:

    1px solid

    rgba(214,207,168,.9);

  min-height:220px;

  display:flex;

  align-items:center;

  justify-content:center;

}

.mini-bg{

  position:absolute;

  inset:0;

  background-image:

    url("cities-sprite.jpg");

  background-repeat:no-repeat;

}

.mini-veil{

  position:absolute;

  inset:0;

  background:

    rgba(255,252,244,.82);

}

.mini-content{

  position:relative;

  z-index:2;

  padding:

    22px

    18px;

}

.mini-title{

  font-size:16px;

  font-weight:650;

  color:#6f7956;

  margin-bottom:10px;

}

.mini-text{

  white-space:pre-line;

  font-size:16px;

  line-height:1.75;

  color:#4c5044;

}

.small-hint{

  font-size:12px;

  line-height:1.65;

  color:#8a8c7e;

  margin-top:14px;

}

/* ===== 結束頁 ===== */

.end-star{

  font-size:29px;

  margin-bottom:18px;

}

.end-title{

  font-family:

    Georgia,

    "Times New Roman",

    serif;

  font-size:22px;

  margin-bottom:18px;

  color:#555b47;

}

.end-text{

  font-size:17px;

  line-height:1.9;

  color:#636755;

}

.back-btn{

  font-size:14px;

  background:transparent;

  color:#858a76;

  text-decoration:underline;

  text-underline-offset:3px;

  margin-top:20px;

  padding:

    8px

    10px;

}

@media(max-width:390px){

  .panel{

    padding:

      26px

      18px

      22px;

  }

  h1{

    font-size:25px;

  }

  .intro,

  .card-text{

    font-size:17px;

  }

}

</style>

</head>

<body>

<div id="bgPhoto"></div>

<div id="bgVeil"></div>

<div class="page">

<div class="shell">

<div class="panel">

<!-- 首頁 -->

<section id="homeScreen">

  <div class="main-star">

    ✦

  </div>

  <h1>

    LITTLE HAPPINESS

  </h1>

  <p class="intro">

    如果今天剛好少了一點開心，<br>

    就從這裡抽一個吧。

  </p>

  <button

    class="primary-btn"

    onclick="startDraw()"

  >

    抽一個小開心 ✦

  </button>

</section>

<!-- 飛機動畫 -->

<section

  id="flightScreen"

  class="flight-screen"

>

  <svg

    class="flight-route"

    viewBox="0 0 300 160"

  >

    <path

      class="route-line"

      d="M35 125 C90 70,185 95,270 32"

    />

  </svg>

  <div class="plane">

    ✈︎

  </div>

  <div class="flight-text">

    正在準備今天的小開心…

  </div>

</section>

<!-- 抽卡結果 -->

<section

  id="resultScreen"

  class="hidden"

>

  <div

    id="resultCard"

    class="result-card"

  >

    <div

      id="cardTitle"

      class="card-title"

    ></div>

    <div

      id="cardText"

      class="card-text"

    ></div>

    <div class="card-star">

      ✦

    </div>

  </div>

  <button

    id="acceptButton"

    class="secondary-btn hidden"

    onclick="finishDraw()"

  >

    收下這份小開心 ✦

  </button>

  <div

    id="firstInfo"

    class="hidden"

  >

    <p class="first-note">

      按下「我知道了」後，<br>

      後續再掃 QR Code，<br>

      就開始正式抽卡囉！

    </p>

    <button

      class="secondary-btn"

      onclick="confirmFirstCard()"

    >

      我知道了 ✦

    </button>

  </div>

  <button

    id="retryButton"

    class="secondary-btn hidden"

    onclick="drawExtraCard()"

  >

    再抽一次 🎲

  </button>

  <button

    id="doubleButton"

    class="secondary-btn hidden"

    onclick="drawDoubleCards()"

  >

    再抽兩張 ✦✦

  </button>

  <div

    id="doubleArea"

    class="double-area hidden"

  >

    <div class="double-caption">

      今天多給妳兩個選擇，<br>

      挑一張比較喜歡的吧。

    </div>

    <div class="mini-card">

      <div

        id="miniBg1"

        class="mini-bg"

      ></div>

      <div class="mini-veil"></div>

      <div class="mini-content">

        <div

          id="doubleTitle1"

          class="mini-title"

        ></div>

        <div

          id="doubleText1"

          class="mini-text"

        ></div>

      </div>

    </div>

    <div class="mini-card">

      <div

        id="miniBg2"

        class="mini-bg"

      ></div>

      <div class="mini-veil"></div>

      <div class="mini-content">

        <div

          id="doubleTitle2"

          class="mini-title"

        ></div>

        <div

          id="doubleText2"

          class="mini-text"

        ></div>

      </div>

    </div>

    <p class="small-hint">

      想用其中一張的話，

      記得先截圖。

    </p>

    <button

      class="secondary-btn"

      onclick="finishDraw()"

    >

      收下今天的小開心 ✦

    </button>

  </div>

</section>

<!-- 結束 -->

<section

  id="endScreen"

  class="hidden"

>

  <div class="end-star">

    ✦

  </div>

  <div

    id="endTitle"

    class="end-title"

  >

    今天的小開心已送達

  </div>

  <div

    id="endText"

    class="end-text"

  ></div>

  <button

    id="backToLastButton"

    class="back-btn hidden"

    onclick="restoreLastView()"

  >

    等等，我還沒截圖 😂

  </button>

</section>

</div>

</div>

</div>

<script>

const HOME_BG =

  "home-flight.jpg";

const SPRITE_BG =

  "cities-sprite.jpg";

/* 15個不同城市 */

const cityPositions = [

  {name:"東京",x:0,y:0},

  {name:"京都",x:50,y:0},

  {name:"首爾",x:100,y:0},

  {name:"大阪",x:0,y:25},

  {name:"香港",x:50,y:25},

  {name:"台北",x:100,y:25},

  {name:"澳門",x:0,y:50},

  {name:"釜山",x:50,y:50},

  {name:"清邁",x:100,y:50},

  {name:"新加坡",x:0,y:75},

  {name:"吉隆坡",x:50,y:75},

  {name:"曼谷",x:100,y:75},

  {name:"河內",x:0,y:100},

  {name:"峴港",x:50,y:100},

  {name:"峇里島",x:100,y:100}

];

/* 15張正式卡 */

const cards = [

{

title:"🎉 今天有中！",

text:

`能量補給送給妳。

7-ELEVEN 100元數位商品禮券。`,

type:"normal",

city:0

},

{

title:"隱藏款 ✦",

text:

`欸，居然被妳抽到了。

今天的小開心，妳自己指定。

（我做得到的範圍內都可）`,

type:"normal",

city:1

},

{

title:"小兜風 🚗",

text:

`走，不管現在多晚。

瘋狂一下吧。

帶妳小兜風散散心。

想用的時候，截圖給我。`,

type:"normal",

city:2

},

{

title:"餐點 🍽️",

text:

`不想煩惱吃什麼的話，

截圖給我。

找個時間帶妳去吃。`,

type:"normal",

city:3

},

{

title:"神秘款 😎",

text:

`這張先截圖傳給我。

其他的先不告訴妳。`,

type:"normal",

city:4

},

{

title:"飲料我請 🥤",

text:

`想喝什麼就選什麼。

截圖給我，這杯算我的。`,

type:"normal",

city:5

},

{

title:"👑 任性額度 +1",

text:

`恭喜獲得今日限定權限：

可以有一件事情

「我爽就好」。

請合理使用 😂`,

type:"normal",

city:6

},

{

title:"彩蛋 😂",

text:

`恭喜，什麼都沒抽到。

系統表示：

妳今天應該自己就會遇到好事。`,

type:"normal",

city:7

},

{

title:"抱怨接收券 😤",

text:

`今天很煩的話，

把這張傳給我。

妳講，我聽。

不一定要找答案。`,

type:"normal",

city:8

},

{

title:"今天的小幸運 ✦",

text:

`能抽到這張，

本身就算今天的一件小幸運。

截圖給我，

可以點一首歌。🎵`,

type:"normal",

city:9

},

{

title:"再抽一次 🎲",

text:

`嗯……

我覺得這張不太行。

不算。

再給妳一次機會。`,

type:"retry",

city:10

},

{

title:"今天值得一個小獎勵 🎁",

text:

`沒有原因也沒關係。

今天就是可以對自己好一點。

上蝦皮挑個喜歡的小東西吧。`,

type:"normal",

city:11

},

{

title:"明天的早餐升級 🍳",

text:

`明天第一餐不要隨便。

截圖給我。

早餐我來處理。`,

type:"normal",

city:12

},

{

title:"雙倍小開心 ✦✦",

text:

`今天好像需要多一點。

再抽兩張吧，

挑一張妳比較喜歡的。

截圖給我。`,

type:"double",

city:13

},

{

title:"週末逃跑計畫 🚗",

text:

`最近如果有點悶，

截圖給我。

找個週末出去晃晃，

去哪裡之後再決定。`,

type:"normal",

city:14

}

];

/* 首次限定 */

const firstCard = {

title:"首次限定 ✦",

text:

`後續真的有東西唷。

請謹慎使用 😂

投資理財有賺有賠，

抽卡時應詳閱公開說明書。

本次為首次體驗，

不列入正式抽卡。`

};

/* 紀錄 */

const KEY_FIRST =

  "littleHappiness_firstSeen_v3";

const KEY_DECK =

  "littleHappiness_remaining_v3";

const KEY_LAST =

  "littleHappiness_lastCard_v3";

let currentView = null;

let lastBackground = null;

/* 首頁照片 */

function setHomeBackground(){

  const bg =

    document.getElementById(

      "bgPhoto"

    );

  bg.style.backgroundImage =

    `url("${HOME_BG}")`;

  bg.style.backgroundSize =

    "cover";

  bg.style.backgroundPosition =

    "center";

  /* 首頁仍然柔和，但比之前清楚 */

  document

    .getElementById(

      "bgVeil"

    )

    .style.background =

    "linear-gradient(" +

    "180deg," +

    "rgba(255,250,247,.24)," +

    "rgba(250,248,231,.34)" +

    ")";

}

/* 城市照片 */

function setCityBackground(

  cityIndex

){

  const p =

    cityPositions[

      cityIndex

    ];

  const bg =

    document.getElementById(

      "bgPhoto"

    );

  bg.style.backgroundImage =

    `url("${SPRITE_BG}")`;

  /*

    3欄 × 5列的大圖。

    一次只顯示其中一格。

  */

  bg.style.backgroundSize =

    "300% 500%";

  bg.style.backgroundPosition =

    `${p.x}% ${p.y}%`;

  /*

    這版城市背景明顯很多。

    不再像之前幾乎全白。

  */

  document

    .getElementById(

      "bgVeil"

    )

    .style.background =

    "linear-gradient(" +

    "180deg," +

    "rgba(255,250,247,.24)," +

    "rgba(250,248,231,.34)" +

    ")";

  lastBackground =

    cityIndex;

}

/* 二選一背景 */

function setMiniBackground(

  element,

  cityIndex

){

  const p =

    cityPositions[

      cityIndex

    ];

  element.style.backgroundSize =

    "300% 500%";

  element.style.backgroundPosition =

    `${p.x}% ${p.y}%`;

}

/* 洗牌 */

function shuffle(array){

  const arr =

    [...array];

  for(

    let i =

      arr.length - 1;

    i > 0;

    i--

  ){

    const j =

      Math.floor(

        Math.random() *

        (i + 1)

      );

    [

      arr[i],

      arr[j]

    ] =

    [

      arr[j],

      arr[i]

    ];

  }

  return arr;

}

/* 建立新一輪 */

function createFreshDeck(){

  let indexes =

    shuffle(

      cards.map(

        (_,index) =>

          index

      )

    );

  const last =

    localStorage.getItem(

      KEY_LAST

    );

  if(

    last !== null &&

    indexes.length > 1 &&

    indexes[0] ===

      Number(last)

  ){

    [

      indexes[0],

      indexes[1]

    ] =

    [

      indexes[1],

      indexes[0]

    ];

  }

  localStorage.setItem(

    KEY_DECK,

    JSON.stringify(

      indexes

    )

  );

  return indexes;

}

/* 抽一張 */

function takeOneCard(){

  let deck;

  try{

    deck =

      JSON.parse(

        localStorage.getItem(

          KEY_DECK

        )

      );

  }

  catch(e){

    deck =

      null;

  }

  if(

    !Array.isArray(

      deck

    ) ||

    deck.length === 0

  ){

    deck =

      createFreshDeck();

  }

  const index =

    deck.shift();

  localStorage.setItem(

    KEY_DECK,

    JSON.stringify(

      deck

    )

  );

  localStorage.setItem(

    KEY_LAST,

    String(

      index

    )

  );

  return {

    index:index,

    card:

      cards[index]

  };

}

/* 畫面控制 */

function hideAll(){

  document

    .getElementById(

      "homeScreen"

    )

    .classList.add(

      "hidden"

    );

  document

    .getElementById(

      "flightScreen"

    )

    .style.display =

      "none";

  document

    .getElementById(

      "resultScreen"

    )

    .classList.add(

      "hidden"

    );

  document

    .getElementById(

      "endScreen"

    )

    .classList.add(

      "hidden"

    );

}

function resetActions(){

  [

    "acceptButton",

    "retryButton",

    "doubleButton",

    "firstInfo",

    "doubleArea"

  ]

  .forEach(

    id => {

      document

        .getElementById(

          id

        )

        .classList.add(

          "hidden"

        );

    }

  );

}

/* 飛機動畫 */

function startFlight(

  callback

){

  hideAll();

  const flight =

    document.getElementById(

      "flightScreen"

    );

  flight.style.display =

    "flex";

  const plane =

    flight.querySelector(

      ".plane"

    );

  plane.style.animation =

    "none";

  void plane.offsetWidth;

  plane.style.animation =

    "flyPlane 1.35s " +

    "cubic-bezier(.25,.6,.35,1) " +

    "forwards";

  setTimeout(

    () => {

      flight.style.display =

        "none";

      callback();

    },

    1400

  );

}

/* 首頁按抽卡 */

function startDraw(){

  startFlight(

    () => {

      if(

        !localStorage.getItem(

          KEY_FIRST

        )

      ){

        showFirstCard();

      }

      else{

        drawOfficialCard();

      }

    }

  );

}

/* 首次限定 */

function showFirstCard(){

  resetActions();

  setHomeBackground();

  document

    .getElementById(

      "resultScreen"

    )

    .classList.remove(

      "hidden"

    );

  document

    .getElementById(

      "cardTitle"

    )

    .innerText =

      firstCard.title;

  document

    .getElementById(

      "cardText"

    )

    .innerText =

      firstCard.text;

  document

    .getElementById(

      "firstInfo"

    )

    .classList.remove(

      "hidden"

    );

  currentView =

    null;

}

/* 我知道了 */

function confirmFirstCard(){

  localStorage.setItem(

    KEY_FIRST,

    "yes"

  );

  hideAll();

  setHomeBackground();

  document

    .getElementById(

      "endScreen"

    )

    .classList.remove(

      "hidden"

    );

  document

    .getElementById(

      "endTitle"

    )

    .innerText =

      "設定完成 ✦";

  document

    .getElementById(

      "endText"

    )

    .innerHTML =

    "下次再掃 QR Code，<br>" +

    "就開始正式抽卡囉！";

  document

    .getElementById(

      "backToLastButton"

    )

    .classList.add(

      "hidden"

    );

}

/* 正式抽卡 */

function drawOfficialCard(){

  const result =

    takeOneCard();

  showCard(

    result.index,

    result.card,

    true

  );

}

/* 顯示卡片 */

function showCard(

  index,

  card,

  saveView

){

  resetActions();

  setCityBackground(

    card.city

  );

  document

    .getElementById(

      "resultScreen"

    )

    .classList.remove(

      "hidden"

    );

  document

    .getElementById(

      "cardTitle"

    )

    .innerText =

      card.title;

  document

    .getElementById(

      "cardText"

    )

    .innerText =

      card.text;

  if(

    card.type ===

      "retry"

  ){

    document

      .getElementById(

        "retryButton"

      )

      .classList.remove(

        "hidden"

      );

  }

  else if(

    card.type ===

      "double"

  ){

    document

      .getElementById(

        "doubleButton"

      )

      .classList.remove(

        "hidden"

      );

  }

  else{

    document

      .getElementById(

        "acceptButton"

      )

      .classList.remove(

        "hidden"

      );

  }

  if(

    saveView

  ){

    currentView = {

      kind:"single",

      index:index

    };

  }

}

/* 再抽一次 */

function drawExtraCard(){

  startFlight(

    () => {

      const result =

        takeOneCard();

      showCard(

        result.index,

        result.card,

        true

      );

    }

  );

}

/* 雙倍小開心 */

function drawDoubleCards(){

  const first =

    takeOneCard();

  const second =

    takeOneCard();

  resetActions();

  document

    .getElementById(

      "doubleArea"

    )

    .classList.remove(

      "hidden"

    );

  document

    .getElementById(

      "doubleTitle1"

    )

    .innerText =

      first.card.title;

  document

    .getElementById(

      "doubleText1"

    )

    .innerText =

      first.card.text;

  setMiniBackground(

    document

      .getElementById(

        "miniBg1"

      ),

    first.card.city

  );

  document

    .getElementById(

      "doubleTitle2"

    )

    .innerText =

      second.card.title;

  document

    .getElementById(

      "doubleText2"

    )

    .innerText =

      second.card.text;

  setMiniBackground(

    document

      .getElementById(

        "miniBg2"

      ),

    second.card.city

  );

  currentView = {

    kind:"double",

    first:

      first.index,

    second:

      second.index,

    base:

      lastBackground

  };

}

/* 收下 */

function finishDraw(){

  hideAll();

  if(

    lastBackground !==

      null

  ){

    setCityBackground(

      lastBackground

    );

  }

  document

    .getElementById(

      "endScreen"

    )

    .classList.remove(

      "hidden"

    );

  document

    .getElementById(

      "endTitle"

    )

    .innerText =

      "今天的小開心已送達 ✦";

  document

    .getElementById(

      "endText"

    )

    .innerHTML =

    "希望有讓今天<br>" +

    "多一點點開心。<br><br>" +

    "下次想起來的時候，<br>" +

    "再來吧。";

  if(

    currentView

  ){

    document

      .getElementById(

        "backToLastButton"

      )

      .classList.remove(

        "hidden"

      );

  }

  else{

    document

      .getElementById(

        "backToLastButton"

      )

      .classList.add(

        "hidden"

      );

  }

}

/* 忘了截圖 */

function restoreLastView(){

  if(

    !currentView

  ){

    return;

  }

  hideAll();

  if(

    currentView.kind ===

      "single"

  ){

    const card =

      cards[

        currentView.index

      ];

    showCard(

      currentView.index,

      card,

      false

    );

  }

  else if(

    currentView.kind ===

      "double"

  ){

    const card1 =

      cards[

        currentView.first

      ];

    const card2 =

      cards[

        currentView.second

      ];

    setCityBackground(

      currentView.base ??

      card1.city

    );

    document

      .getElementById(

        "resultScreen"

      )

      .classList.remove(

        "hidden"

      );

    resetActions();

    document

      .getElementById(

        "doubleArea"

      )

      .classList.remove(

        "hidden"

      );

    document

      .getElementById(

        "doubleTitle1"

      )

      .innerText =

        card1.title;

    document

      .getElementById(

        "doubleText1"

      )

      .innerText =

        card1.text;

    setMiniBackground(

      document

        .getElementById(

          "miniBg1"

        ),

      card1.city

    );

    document

      .getElementById(

        "doubleTitle2"

      )

      .innerText =

        card2.title;

    document

      .getElementById(

        "doubleText2"

      )

      .innerText =

        card2.text;

    setMiniBackground(

      document

        .getElementById(

          "miniBg2"

        ),

      card2.city

    );

  }

}

/* 網站載入 */

window.addEventListener(

  "DOMContentLoaded",

  () => {

    setHomeBackground();

  }

);

</script>
